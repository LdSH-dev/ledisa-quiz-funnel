<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ledisa Quiz</title>
  <meta name="description" content="Find the right Ledisa protocol for your goals." />

  <!-- GTM snippet goes here -->

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    onload="this.rel='stylesheet'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
    />
  </noscript>

  <style>
    :root {
      --color-bg: #FFFAF4;
      --color-text: #121212;
      --color-text-muted: rgba(18, 18, 18, 0.75);
      --color-border: rgba(18, 18, 18, 0.12);
      --color-accent: #FFC074;
      --font-heading: 'Fraunces', Georgia, serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
      --space-3: 16px;
      --space-4: 24px;
      --radius-pill: 999px;
      --transition-step: 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, h1, p { margin: 0; padding: 0; }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
      font-size: clamp(1.75rem, 4vw + 1rem, 2.5rem);
    }
    .quiz-app {
      display: flex;
      flex-direction: column;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      padding: var(--space-4) var(--space-3);
      gap: var(--space-4);
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background-color: var(--color-border);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--color-text);
      border-radius: var(--radius-pill);
      transition: width var(--transition-step);
    }
    .step-viewport { position: relative; flex: 1; }
    .step.active { opacity: 1; transform: none; position: relative; }
  </style>

  <link
    rel="stylesheet"
    href="css/base.css"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link rel="stylesheet" href="css/base.css" />
  </noscript>

  <script defer src="js/config.js"></script>
  <!-- Generated from .env by scripts/build-config.js; harmlessly 404s if not built yet. -->
  <script defer src="js/config.local.js"></script>
  <script defer src="js/utils.js"></script>
  <script defer src="js/consent.js"></script>
  <script defer src="js/klaviyo.js"></script>
  <script defer src="js/quiz.js"></script>
</head>
<body>
  <div class="quiz-app">
    <div class="quiz-header">
      <button type="button" class="back-btn" id="back-btn" hidden aria-label="Go back to previous step">
        &larr; Back
      </button>
      <span class="progress-text" id="progress-text" aria-live="polite">Step 1 of 8</span>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <main class="step-viewport" id="step-viewport">
      <section class="step active" id="step-1" data-step="1">
        <!-- h1 text must match QUESTIONS[0].question in js/quiz.js — kept static so it renders as LCP without JS. -->
        <h1>What's your main goal right now?</h1>
      </section>
    </main>
  </div>

  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-labelledby="cookie-banner-title" hidden>
    <div class="cookie-banner-inner">
      <div class="cookie-banner-text">
        <p id="cookie-banner-title" class="cookie-banner-title">We use cookies</p>
        <p class="cookie-banner-body">
          We use analytics and marketing cookies to understand how visitors use our funnel and to improve future experiences.
          You can accept all or reject non-essential ones. See our
          <a href="https://ledisa.com/pages/privacy-policy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
        </p>
      </div>
      <div class="cookie-banner-actions">
        <button type="button" class="btn btn-secondary" data-consent-action="reject">Reject</button>
        <button type="button" class="btn btn-primary" data-consent-action="accept">Accept all</button>
      </div>
    </div>
  </div>

  <button type="button" class="cookie-preferences-btn" id="cookie-preferences-btn" hidden>Cookie preferences</button>
</body>
</html>
