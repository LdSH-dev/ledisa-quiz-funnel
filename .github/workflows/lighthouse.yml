name: Lighthouse comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: PR preview vs main production
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel preview to be ready
        id: vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_interval: 10

      - name: Run Lighthouse against preview and production
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.vercel-preview.outputs.url }}
            https://ledisa-quiz-funnel.vercel.app/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Build comparison comment
        id: comment
        uses: actions/github-script@v7
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          PROD_URL: https://ledisa-quiz-funnel.vercel.app/
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST);
            const links = JSON.parse(process.env.LINKS);
            const previewUrl = process.env.PREVIEW_URL;
            const prodUrl = process.env.PROD_URL;

            const pick = (url) =>
              manifest.find((m) => m.url === url && m.isRepresentativeRun)
              || manifest.find((m) => m.url === url);

            const preview = pick(previewUrl);
            const prod = pick(prodUrl);

            if (!preview || !prod) {
              core.setFailed('Could not resolve representative Lighthouse run for one of the URLs.');
              return;
            }

            const score = (v) => Math.round((v ?? 0) * 100);
            const diff = (a, b) => {
              const d = a - b;
              if (d === 0) return '⚪ 0';
              return `${d > 0 ? '🟢 +' : '🔴 '}${d}`;
            };

            const metrics = ['performance', 'accessibility', 'best-practices', 'seo'];
            const rows = metrics.map((k) => {
              const p = score(preview.summary[k]);
              const m = score(prod.summary[k]);
              return `| ${k} | ${p} | ${m} | ${diff(p, m)} |`;
            });

            const body = [
              '## 🚦 Lighthouse: PR preview vs main',
              '',
              `- **Preview**: ${previewUrl}`,
              `- **Baseline**: ${prodUrl}`,
              '- _Scores are median of 3 runs; ±5 points is within Lighthouse variance._',
              '',
              '| Metric | Preview | Main | Δ |',
              '| --- | ---: | ---: | :---: |',
              ...rows,
              '',
              `[Preview report](${links[previewUrl] || '#'}) · [Main report](${links[prodUrl] || '#'})`,
            ].join('\n');

            core.setOutput('body', body);

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-comparison
          message: ${{ steps.comment.outputs.body }}
