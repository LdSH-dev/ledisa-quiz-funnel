name: Lighthouse comparison

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: PR preview vs main production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        # Provides the git context LHCI needs for its GitHub status check.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for Vercel preview to be ready
        id: vercel-preview
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 300
          check_interval: 10

      - name: Run Lighthouse against preview and production
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.vercel-preview.outputs.url }}
            https://ledisa-quiz-funnel.vercel.app/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Build comparison comment
        id: comment
        uses: actions/github-script@v7
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
          PREVIEW_URL: ${{ steps.vercel-preview.outputs.url }}
          PROD_URL: https://ledisa-quiz-funnel.vercel.app/
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST);
            const links = JSON.parse(process.env.LINKS);
            const previewUrl = process.env.PREVIEW_URL;
            const prodUrl = process.env.PROD_URL;

            // wait-for-vercel-preview returns URLs without a trailing slash,
            // but Lighthouse stores them with one. Normalize both sides.
            const normalize = (u) => (u || '').replace(/\/+$/, '') + '/';

            const pick = (url) => {
              const target = normalize(url);
              return manifest.find((m) => normalize(m.url) === target && m.isRepresentativeRun)
                || manifest.find((m) => normalize(m.url) === target);
            };

            const getLink = (url) => {
              const target = normalize(url);
              const entry = Object.entries(links).find(([k]) => normalize(k) === target);
              return entry ? entry[1] : '#';
            };

            const preview = pick(previewUrl);
            const prod = pick(prodUrl);

            if (!preview || !prod) {
              console.log('Preview URL input:', previewUrl);
              console.log('Prod URL input:', prodUrl);
              console.log('Manifest URLs:', manifest.map((m) => m.url));
              console.log('Links keys:', Object.keys(links));
              core.setFailed('Could not resolve representative Lighthouse run for one of the URLs.');
              return;
            }

            const score = (v) => Math.round((v ?? 0) * 100);
            const diff = (a, b) => {
              const d = a - b;
              if (d === 0) return '⚪ 0';
              return `${d > 0 ? '🟢 +' : '🔴 '}${d}`;
            };

            const metrics = ['performance', 'accessibility', 'best-practices', 'seo'];
            const rows = metrics.map((k) => {
              const p = score(preview.summary[k]);
              const m = score(prod.summary[k]);
              return `| ${k} | ${p} | ${m} | ${diff(p, m)} |`;
            });

            const body = [
              '## 🚦 Lighthouse: PR preview vs main',
              '',
              `- **Preview**: ${previewUrl}`,
              `- **Baseline**: ${prodUrl}`,
              '- _Scores are median of 3 runs; ±5 points is within Lighthouse variance._',
              '',
              '| Metric | Preview | Main | Δ |',
              '| --- | ---: | ---: | :---: |',
              ...rows,
              '',
              `[Preview report](${getLink(previewUrl)}) · [Main report](${getLink(prodUrl)})`,
            ].join('\n');

            core.setOutput('body', body);

      - name: Post or update PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: lighthouse-comparison
          message: ${{ steps.comment.outputs.body }}
